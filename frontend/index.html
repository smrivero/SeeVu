<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeeVu — AI Call Automation</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 40 40' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='40' y2='40' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%2338C6F4'/%3E%3Cstop offset='1' stop-color='%230B5CAD'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='9' fill='url(%23g)'/%3E%3Cpath d='M8 21 Q14 14 20 14 Q26 14 32 21 Q26 28 20 28 Q14 28 8 21Z' fill='white'/%3E%3Ccircle cx='20' cy='21' r='5.5' fill='%231EA7F2'/%3E%3Cpath d='M14.5 21v2.5M17 19v5M19.5 20v3M22 18.5v6M24.5 19.5v4' stroke='white' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sidebar-w: 220px;
  --r: 8px;
  --t: .15s ease;
}

/* ── Palette ── */
:root[data-theme="light"] {
  --bg:           #F4FAFE;
  --surface:      #ffffff;
  --surface2:     #EEF7FD;
  --surface3:     #E5F3FA;
  --border:       #D7EAF7;
  --border-hi:    #B8D9EF;
  --text:         #0B1B2E;
  --text-2:       #5B7188;
  --text-3:       #8FA8C3;
  --accent:       #1EA7F2;
  --accent-h:     #0B5CAD;
  --accent-s:     #EAF7FF;
  --green:        #16a34a;
  --green-s:      #dcfce7;
  --red:          #dc2626;
  --red-s:        #fee2e2;
  --amber:        #d97706;
  --amber-s:      #fef3c7;
  --sb-bg:        #ffffff;
  --sb-border:    #D7EAF7;
  --nav-h:        #F4FAFE;
  --nav-act-bg:   #EAF7FF;
  --nav-act-c:    #0B5CAD;
  --user-c:       #0B5CAD;
  --user-bg:      #EAF7FF;
  --bot-c:        #16a34a;
  --bot-bg:       #f0fdf4;
  --shadow:       0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.03);
  --shadow-md:    0 4px 16px rgba(11,92,173,.10);
  --row-h:        #EEF7FD;
}

:root[data-theme="dark"] {
  --bg:           #08111F;
  --surface:      #0C1728;
  --surface2:     #111E31;
  --surface3:     #0F1A2A;
  --border:       rgba(56,198,244,.16);
  --border-hi:    rgba(56,198,244,.28);
  --text:         #EAF6FF;
  --text-2:       #8FA8C3;
  --text-3:       #4A6A88;
  --accent:       #38C6F4;
  --accent-h:     #1EA7F2;
  --accent-s:     rgba(30,167,242,.12);
  --green:        #4ade80;
  --green-s:      #14532d;
  --red:          #f87171;
  --red-s:        #450a0a;
  --amber:        #fbbf24;
  --amber-s:      #3d2e00;
  --sb-bg:        #0C1728;
  --sb-border:    rgba(56,198,244,.16);
  --nav-h:        #111E31;
  --nav-act-bg:   rgba(56,198,244,.12);
  --nav-act-c:    #38C6F4;
  --user-c:       #7DD8F8;
  --user-bg:      #0C2A42;
  --bot-c:        #86efac;
  --bot-bg:       #14532d;
  --shadow:       0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
  --shadow-md:    0 4px 20px rgba(0,0,0,.5);
  --row-h:        #111E31;
}

/* ── Base ── */
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  font-size: 14px;
  line-height: 1.5;
  transition: background var(--t), color var(--t);
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--sb-bg);
  border-right: 1px solid var(--sb-border);
  display: flex;
  flex-direction: column;
  position: fixed;
  left: 0; top: 0; bottom: 0;
  z-index: 20;
  transition: background var(--t), border-color var(--t);
}

.sb-brand {
  padding: 18px 14px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--sb-border);
  margin-bottom: 6px;
  flex-shrink: 0;
}

.sb-icon {
  width: 30px; height: 30px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.sb-icon svg { width: 15px; height: 15px; color: #fff; }

.sb-name { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.2; letter-spacing: -.01em; }
.sb-sub  { font-size: 10px; color: var(--text-3); margin-top: 1px; }

.sb-nav {
  flex: 1;
  padding: 4px 8px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  overflow-y: auto;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px 8px 8px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  transition: all var(--t);
  border: none;
  border-left: 3px solid transparent;
  background: none;
  width: 100%;
  text-align: left;
  border-radius: 0 6px 6px 0;
}

.nav-item:hover { background: var(--nav-h); color: var(--text); border-left-color: transparent; }
.nav-item.active { background: var(--nav-act-bg); color: var(--nav-act-c); font-weight: 600; border-left-color: var(--accent); }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: .55; }
.nav-item.active svg { opacity: 1; color: var(--accent); }

.sb-footer {
  padding: 10px 8px;
  border-top: 1px solid var(--sb-border);
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
}

.sb-footer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 6px;
  border-radius: 6px;
}

.sb-label { font-size: 11px; color: var(--text-3); font-weight: 500; }

.lang-toggle {
  display: flex;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  overflow: hidden;
}

.lang-btn {
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  background: none;
  color: var(--text-3);
  transition: all var(--t);
}

.lang-btn.active { background: var(--accent); color: #fff; }

.switch { position: relative; width: 34px; height: 18px; cursor: pointer; display: inline-block; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.slider { position: absolute; inset: 0; background: var(--border-hi); border-radius: 18px; transition: background var(--t); }
.slider:before { content: ''; position: absolute; width: 12px; height: 12px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform var(--t); }
input:checked + .slider { background: var(--accent); }
input:checked + .slider:before { transform: translateX(16px); }

.conn-row {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 6px;
  font-size: 11px; color: var(--text-3);
}

.conn-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

/* ── Main ── */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
.screen.active { display: flex; }

/* ── Page header ── */
.pg-header {
  padding: 20px 28px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-shrink: 0;
}

.pg-header h1 {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -.02em;
}

.pg-header p {
  font-size: 12px;
  color: var(--text-2);
  margin-top: 2px;
}

.pg-header-r { display: flex; align-items: center; gap: 8px; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 13px;
  border-radius: 6px; border: none;
  font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all var(--t);
  white-space: nowrap; line-height: 1;
}

.btn svg { width: 13px; height: 13px; flex-shrink: 0; }
.btn-primary  { background: linear-gradient(135deg,#1EA7F2,#38C6F4); color: #fff; border: none; }
.btn-primary:hover  { background: linear-gradient(135deg,#0B98E0,#1EA7F2); box-shadow: 0 2px 8px rgba(30,167,242,.35); }
.btn-secondary { background: var(--surface); color: var(--text-2); border: 1px solid var(--border); }
.btn-secondary:hover { color: var(--text); border-color: var(--border-hi); }
.btn-ghost { background: none; color: var(--text-2); border: 1px solid transparent; }
.btn-ghost:hover { background: var(--nav-h); color: var(--text); }
.btn:disabled { opacity: .4; cursor: default; pointer-events: none; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ── Badges ── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
}

.badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.badge-green  { background: var(--green-s);  color: var(--green); }
.badge-red    { background: var(--red-s);    color: var(--red); }
.badge-accent { background: var(--accent-s); color: var(--accent); }
.badge-gray   { background: var(--surface2); color: var(--text-2); border: 1px solid var(--border); }

/* ── Metric cards ── */
.metrics-row {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 12px;
  padding: 20px 28px 4px;
  flex-shrink: 0;
}

.mc {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 10px;
}

.mc-head { display: flex; align-items: center; justify-content: space-between; }

.mc-label {
  font-size: 11px; font-weight: 600;
  color: var(--text-2);
  text-transform: uppercase; letter-spacing: .06em;
}

.mc-icon {
  width: 28px; height: 28px; border-radius: 7px;
  background: var(--accent-s);
  display: flex; align-items: center; justify-content: center;
}

.mc-icon svg { width: 13px; height: 13px; color: var(--accent); }

.mc-val {
  font-size: 26px; font-weight: 700;
  letter-spacing: -.03em; color: var(--text); line-height: 1;
}

.mc-sub { font-size: 11px; color: var(--text-3); }

/* ── Table area ── */
.table-area {
  padding: 16px 28px 28px;
  flex: 1;
  overflow-y: auto;
  display: flex; flex-direction: column;
}

.table-toolbar {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.table-title {
  font-size: 13px; font-weight: 600; color: var(--text);
  display: flex; align-items: center; gap: 6px;
}

.live-dot-sm {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--green); animation: pulse 2s infinite;
}

@keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.3 } }

.last-upd { font-size: 11px; color: var(--text-3); }

.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: var(--shadow);
  flex: 1;
}

table { width: 100%; border-collapse: collapse; }

thead th {
  background: var(--surface2);
  padding: 10px 14px;
  text-align: left;
  font-size: 11px; color: var(--text-3);
  text-transform: uppercase; letter-spacing: .06em;
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

tbody tr.main {
  cursor: pointer;
  transition: background var(--t);
  border-bottom: 1px solid var(--border);
}

tbody tr.main:last-child { border-bottom: none; }
tbody tr.main:hover { background: var(--row-h); }

tbody td {
  padding: 11px 14px;
  font-size: 13px;
  color: var(--text);
  vertical-align: middle;
}

.td-2  { color: var(--text-2); font-size: 12px; }
.td-mono { font-family: 'SF Mono','Fira Code',monospace; font-size: 12px; color: var(--text-2); }

.chevron { color: var(--text-3); font-size: 12px; }

/* ── Detail row ── */
.detail { display: none; }
.detail td { padding: 0; border-bottom: 1px solid var(--border); }

.detail-wrap {
  display: grid;
  grid-template-columns: 210px 1fr;
}

.detail-stats {
  padding: 16px;
  border-right: 1px solid var(--border);
  background: var(--surface2);
  display: flex; flex-direction: column; gap: 0;
}

.detail-sec { font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--text-3); margin-bottom: 8px; }

.stat-row {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: var(--text-2);
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
}

.stat-row:last-of-type { border-bottom: none; }
.stat-row strong { color: var(--text); font-weight: 600; }

.detail-transcript {
  padding: 16px 20px;
  max-height: 380px;
  overflow-y: auto;
  background: var(--surface);
}

.tx-title { font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--text-3); margin-bottom: 12px; }

.turn { margin-bottom: 10px; display: flex; flex-direction: column; gap: 3px; }
.turn-label { font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-3); }
.turn-bubble { font-size: 13px; line-height: 1.5; padding: 8px 12px; border-radius: 8px; }
.turn.user .turn-bubble      { background: var(--user-bg); color: var(--user-c); }
.turn.assistant .turn-bubble { background: var(--bot-bg);  color: var(--bot-c); }

/* Audio strip */
.audio-strip {
  display: flex; gap: 12px; flex-wrap: wrap;
  padding: 10px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.audio-track { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 200px; }
.audio-label { font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-3); }
.audio-track audio { width: 100%; height: 28px; }

/* Play button */
.play-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2);
  font-size: 11px; font-weight: 600; cursor: pointer;
  transition: all var(--t); white-space: nowrap;
}

.play-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── Analysis ── */
.analysis-trigger {
  width: 100%; margin-top: 12px; padding: 7px;
  background: none; border: 1px dashed var(--border-hi);
  color: var(--text-2); font-size: 11px; font-weight: 600;
  border-radius: 6px; cursor: pointer; transition: all var(--t);
}

.analysis-trigger:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-s); }
.analysis-trigger:disabled { opacity: .4; cursor: default; }

.analysis-box {
  margin-top: 10px; padding: 10px;
  border-radius: 7px;
  background: var(--surface); border: 1px solid var(--border);
}

.analysis-title { font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-3); margin-bottom: 7px; }

.s-badge {
  display: inline-block; padding: 1px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 700; margin-right: 6px;
}

.s-pos { background: var(--green-s); color: var(--green); }
.s-neu { background: var(--surface2); color: var(--text-2); border: 1px solid var(--border); }
.s-neg { background: var(--red-s); color: var(--red); }

.analysis-summary { font-size: 12px; line-height: 1.5; color: var(--text-2); margin: 7px 0 5px; }
.analysis-hl { list-style: none; padding: 0; margin: 0; }
.analysis-hl li {
  font-size: 11px; color: var(--text-3);
  padding: 2px 0 2px 12px; position: relative; line-height: 1.4;
}
.analysis-hl li::before { content: '–'; position: absolute; left: 2px; color: var(--accent); }

/* ── Provider/Voice badges ── */
.prov-badge {
  display: inline-flex; align-items: center;
  padding: 1px 7px; border-radius: 4px;
  font-size: 10px; font-weight: 700; letter-spacing: .04em;
  background: var(--accent-s); color: var(--accent); white-space: nowrap;
}
.voice-badge {
  display: inline-flex; align-items: center;
  padding: 1px 7px; border-radius: 4px;
  font-size: 10px; font-weight: 600;
  background: var(--surface2); color: var(--text-2);
  border: 1px solid var(--border); white-space: nowrap;
}

/* ── Token mini-cards ── */
.tok-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 12px; }
.tok-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 7px; padding: 8px 10px;
  display: flex; flex-direction: column; gap: 2px;
}
.tok-card-label { font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-3); }
.tok-card-val { font-size: 16px; font-weight: 700; color: var(--text);
  letter-spacing: -.02em; line-height: 1.2; }

/* ── Detail sections ── */
.det-rec {
  background: var(--surface2); border-bottom: 1px solid var(--border);
  padding: 10px 16px;
}
.det-sec-hd { font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--text-3); margin-bottom: 8px; }
.det-body { display: grid; grid-template-columns: 230px 1fr; }
.det-tokens {
  padding: 14px 14px; border-right: 1px solid var(--border);
  background: var(--surface2); overflow-y: auto;
}
.det-transcript {
  padding: 14px 18px; max-height: 360px; overflow-y: auto;
  background: var(--surface);
}
.det-adv { border-top: 1px solid var(--border); background: var(--surface2); }
.det-adv summary {
  padding: 7px 16px; font-size: 11px; font-weight: 600;
  color: var(--text-2); cursor: pointer; user-select: none;
  list-style: none; display: flex; align-items: center; gap: 6px;
}
.det-adv summary::-webkit-details-marker { display: none; }
.det-adv summary::before { content: '›'; font-size: 14px; display: inline-block; transition: transform .15s; }
.det-adv[open] summary::before { transform: rotate(90deg); }
.det-adv pre {
  padding: 8px 16px 12px; font-family: 'SF Mono','Fira Code',monospace;
  font-size: 11px; line-height: 1.5; color: var(--text-2);
  white-space: pre-wrap; word-break: break-all;
  max-height: 200px; overflow-y: auto;
}

/* ── Empty state ── */
.empty-state {
  padding: 64px 28px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.empty-state-icon {
  width: 48px; height: 48px; border-radius: 12px;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
}
.empty-state-icon svg { width: 22px; height: 22px; color: var(--text-3); }
.empty-state h3 { font-size: 15px; font-weight: 600; color: var(--text); }
.empty-state p  { font-size: 13px; color: var(--text-2); }

/* ── Test Call ── */
.testcall-body {
  flex: 1;
  display: grid;
  grid-template-columns: 330px 1fr;
  overflow: hidden;
  min-height: 0;
}

.tc-right {
  display: flex; flex-direction: column; overflow: hidden;
}

.tc-iframe-wrap {
  flex: 0 0 300px; border-bottom: 1px solid var(--border);
  overflow: hidden; position: relative;
}

/* Agent state bar */
.agent-state-bar {
  padding: 7px 14px; border-bottom: 1px solid var(--border);
  background: var(--surface2); display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.astate-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; transition: background .3s;
}
.astate-dot.idle     { background: var(--text-3); }
.astate-dot.listening { background: var(--green); animation: pulse 2s infinite; }
.astate-dot.speaking { background: var(--accent); animation: pulse 1s infinite; }
.astate-dot.thinking { background: var(--amber); animation: pulse 1s infinite; }
.astate-label { font-size: 11px; font-weight: 600; color: var(--text-2); }

.tc-left {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}

.tc-section-hd {
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--border);
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-2);
  flex-shrink: 0;
}

.tc-section-body {
  padding: 14px 16px;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px;
}

.field { display: flex; flex-direction: column; gap: 4px; }

.field label {
  font-size: 11px; font-weight: 600; color: var(--text-2);
  text-transform: uppercase; letter-spacing: .04em;
}

.field select, .field input {
  padding: 7px 10px; border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg); color: var(--text);
  font-size: 13px; width: 100%; outline: none;
  transition: border-color var(--t); font-family: inherit;
}

.field select:focus, .field input:focus { border-color: var(--accent); }

.prompt-pane {
  flex: 1; display: flex; flex-direction: column;
  border-top: 1px solid var(--border); min-height: 0;
  overflow: hidden;
}

.prompt-pane-body {
  flex: 1; padding: 12px 16px;
  display: flex; flex-direction: column; gap: 8px;
  min-height: 0; overflow: hidden;
}

.prompt-ta {
  flex: 1; resize: none; min-height: 0;
  font-family: 'SF Mono','Fira Code',monospace;
  font-size: 12px; line-height: 1.5; padding: 10px;
  border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); outline: none;
  transition: border-color var(--t);
}

.prompt-ta:focus { border-color: var(--accent); }
.prompt-actions { display: flex; gap: 6px; }

.tc-iframe { border: none; width: 100%; height: 100%; background: var(--bg); }

/* Live panel */
.live-panel {
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}

.live-hd {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}

.live-hd h3 {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-2); flex: 1;
}

.live-status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-3); flex-shrink: 0; transition: background .3s;
}

.live-status-dot.on { background: var(--green); animation: pulse 1.5s infinite; }

.live-info {
  padding: 9px 14px; border-bottom: 1px solid var(--border);
  font-size: 11px; color: var(--text-2); line-height: 1.6;
  background: var(--surface2); flex-shrink: 0;
}

.live-turns {
  flex: 1; overflow-y: auto;
  padding: 12px; display: flex; flex-direction: column; gap: 8px;
}

.live-turn { display: flex; flex-direction: column; gap: 3px; }

.live-role {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-3);
}

.live-bubble {
  font-size: 12px; line-height: 1.5;
  padding: 7px 10px; border-radius: 7px;
}

.live-turn.user      .live-bubble { background: var(--user-bg); color: var(--user-c); }
.live-turn.assistant .live-bubble { background: var(--bot-bg);  color: var(--bot-c); }
.live-empty { font-size: 12px; color: var(--text-3); text-align: center; padding: 24px 0; }
.live-pending { opacity: .65; font-style: italic; }

/* ── Settings ── */
.settings-body {
  flex: 1; overflow-y: auto; padding: 24px 28px;
}

.settings-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 16px; max-width: 860px;
}

.sc { background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }

.sc-full { grid-column: 1/-1; }

.sc-hd {
  padding: 13px 18px; border-bottom: 1px solid var(--border);
  background: var(--surface2);
  font-size: 13px; font-weight: 600; color: var(--text);
}

.sc-body {
  padding: 16px 18px;
  display: flex; flex-direction: column; gap: 12px;
}

.settings-ta {
  width: 100%; resize: vertical; min-height: 220px; padding: 10px;
  border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text);
  font-size: 12px; line-height: 1.5; outline: none;
  font-family: 'SF Mono','Fira Code',monospace;
  transition: border-color var(--t);
}

.settings-ta:focus { border-color: var(--accent); }

.sfb {
  font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600;
}

.sfb.ok  { background: var(--green-s); color: var(--green); }
.sfb.err { background: var(--red-s);   color: var(--red); }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.55);
  display: none; align-items: center; justify-content: center;
  z-index: 100; backdrop-filter: blur(3px);
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px; width: 380px;
  display: flex; flex-direction: column; gap: 14px;
  box-shadow: var(--shadow-md);
}

.modal h3 { font-size: 16px; font-weight: 700; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* ── Responsive ── */
@media (max-width: 780px) {
  .sidebar { transform: translateX(-100%); transition: transform .2s; }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .metrics-row { grid-template-columns: repeat(2,1fr); padding: 14px 16px 4px; }
  .table-area { padding: 12px 16px 20px; }
  .pg-header { padding: 14px 16px; }
  .testcall-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow-y: auto; }
  .tc-left { max-height: 260px; overflow: hidden; }
  .tc-right { min-height: 300px; }
  .tc-iframe-wrap { flex: 0 0 200px; }
  .live-panel { min-height: 200px; }
  .settings-grid { grid-template-columns: 1fr; }
  .sc-full { grid-column: auto; }
  .settings-body { padding: 16px; }
}
</style>
</head>

    tableTitle:'Conversaciones Recientes', loading:'Cargando…',
    colDate:'Fecha', colOrigin:'Origen', colDuration:'Duración',

    noConv:'Sin conversaciones aún', noConvSub:'Iniciá una llamada para verla aquí',

let currentLang  = localStorage.getItem('lang')  || 'en';
let currentTheme = localStorage.getItem('theme') || 'light';
let savedPrompts = [];
let lastConvCount = -1;
let openRows = new Set();
let wasActive = false;
let _modalSrc = 'tc';

function t(k) { return I18N[currentLang][k] || k; }

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = I18N[currentLang][el.dataset.i18n];
    if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll('[data-role]').forEach(el => {
    el.textContent = el.dataset.role === 'user' ? t('user') : t('assistant');
  });
  document.querySelectorAll('[data-track]').forEach(el => {
    el.textContent = el.dataset.track === 'bot' ? t('trackAgent') : t('trackUser');
  });
}

function setLang(lang, btn) {
  currentLang = lang;
  localStorage.setItem('lang', lang);
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyI18n();
}

function toggleTheme(cb) {
  const theme = cb.checked ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  currentTheme = theme;
  localStorage.setItem('theme', theme);
}

// ── Navigation ───────────────────────────────────────────────────────────────
function showScreen(id, navEl) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  (navEl || document.getElementById('nav-' + id))?.classList.add('active');
}

// ── Conversations ─────────────────────────────────────────────────────────────
function fmtDur(s) {
  return s < 60 ? s + 's' : Math.floor(s/60) + 'm ' + (s%60) + 's';
}

function relTime(iso) {
  if (!iso) return '—';
  const d = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (d < 60)    return 'just now';
  if (d < 3600)  return Math.floor(d/60) + 'm ago';
  if (d < 86400) return Math.floor(d/3600) + 'h ago';
  return Math.floor(d/86400) + 'd ago';
}

function updateOnlineStatus(online) {
  const dot = document.querySelector('.conn-dot');
  if (dot) dot.style.background = online ? '' : 'var(--red)';
  const badge = document.querySelector('#onlineBadge');
  if (badge) {
    badge.className = 'badge ' + (online ? 'badge-green' : 'badge-red');
    badge.innerHTML = `<span class="badge-dot"></span><span>${online ? t('badgeOnline') : t('badgeOffline')}</span>`;
  }
}

function renderRows(convs) {
  if (!convs.length) return `<tr><td colspan="7" style="padding:0"><div class="empty-state">
    <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:56px;height:56px">
      <defs><linearGradient id="sv-em" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop stop-color="#38C6F4"/><stop offset="1" stop-color="#0B5CAD"/></linearGradient></defs>
      <rect width="56" height="56" rx="13" fill="url(#sv-em)"/>
      <path d="M10 28 Q19 19 28 19 Q37 19 46 28 Q37 37 28 37 Q19 37 10 28Z" fill="white"/>
      <circle cx="28" cy="28" r="7.5" fill="#1EA7F2"/>
      <path d="M21 28v3M24 25.5v7M27 27v5M30 24.5v8M33 26v5.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h3>${t('noConv')}</h3>
    <p>${t('noConvSub')}</p>
    <button class="btn btn-primary btn-sm" onclick="showScreen('testcall',document.getElementById('nav-testcall'))">${t('navTest')} →</button>
  </div></td></tr>`;

  return convs.map(c => {
    const sid  = c.session_id || '';
    const iso  = c.started_at || '';
    const rel  = relTime(iso);
    const full = iso.slice(0,19).replace('T',' ');
    const dur  = fmtDur(c.duration_seconds || 0);
    const llm  = (c.usage || {}).llm || {};
    const tok  = llm.total_tokens      || 0;
    const pTok = llm.prompt_tokens     || 0;
    const cTok = llm.completion_tokens || 0;
    const tts  = (c.usage || {}).tts_characters || 0;
    const from = (c.call_info || {}).from_number || 'browser';
    const cfg  = c.config || {};
    const voice = cfg.voice || '—';
    const prov  = (cfg.provider || '—').replace('_realtime','').replace(/\b\w/g,x=>x.toUpperCase());
    const msgs  = c.messages || [];
    const hasBot  = !!c.has_audio_bot;
    const hasUser = !!c.has_audio_user;

    const originSvg = from === 'browser'
      ? `<svg fill="none" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.6" style="width:11px;height:11px;vertical-align:-.1em;margin-right:3px"><circle cx="8" cy="8" r="6.5"/><path d="M5.5 8a8 8 0 0 0 2.5 4.5A8 8 0 0 0 10.5 8a8 8 0 0 0-2.5-4.5A8 8 0 0 0 5.5 8zM1.5 8h13" stroke-linecap="round"/></svg>`
      : `<svg fill="none" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.6" style="width:11px;height:11px;vertical-align:-.1em;margin-right:3px"><path d="M3.5 1.5h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-11a1 1 0 0 1 1-1z" stroke-linecap="round"/><circle cx="8" cy="12" r=".8" fill="currentColor" stroke="none"/></svg>`;

    const botPlayer  = hasBot  ? `<div class="audio-track"><span class="audio-label">${t('trackAgent')}</span><audio id="audio-bot-${sid}" controls src="/api/audio/bot/${sid}"></audio></div>`  : '';
    const userPlayer = hasUser ? `<div class="audio-track"><span class="audio-label">${t('trackUser')}</span><audio id="audio-user-${sid}" controls src="/api/audio/user/${sid}"></audio></div>` : '';

    const recSection = (hasBot || hasUser)
      ? `<div class="det-rec"><div class="det-sec-hd">${t('recordings')}</div><div class="audio-strip">${botPlayer}${userPlayer}</div></div>`
      : `<div class="det-rec"><div class="det-sec-hd">${t('recordings')}</div><span style="font-size:12px;color:var(--text-3)">${t('noRecording')}</span></div>`;

    const audioBtns = [
      hasBot  ? `<button class="play-btn" onclick="event.stopPropagation();playAudio('${sid}','bot')">▶ ${t('trackAgent')}</button>` : '',
      hasUser ? `<button class="play-btn" onclick="event.stopPropagation();playAudio('${sid}','user')">▶ ${t('trackUser')}</button>` : '',
    ].filter(Boolean).join(' ') || '<span style="color:var(--text-3)">—</span>';

    const tx = msgs.length
      ? msgs.map(m => {
          const cls = m.role === 'user' ? 'user' : 'assistant';
          const lbl = m.role === 'user' ? t('user') : t('assistant');
          return `<div class="turn ${cls}"><span class="turn-label">${lbl}</span><div class="turn-bubble">${(m.content||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div></div>`;
        }).join('')
      : `<div style="color:var(--text-3);font-size:12px;padding:24px 0;text-align:center">${t('noTranscript')}</div>`;

    const analysisHtml = c.analysis
      ? renderAnalysis(c.analysis)
      : `<button class="analysis-trigger" onclick="analyzeCall('${sid}',this)">${t('analyzeBtn')}</button>`;

    const rawJson = JSON.stringify(c, null, 2).replace(/</g,'&lt;').replace(/>/g,'&gt;');

    return `
      <tr class="main" onclick="toggle('${sid}')">
        <td class="td-2"><span title="${full}">${rel}</span></td>
        <td class="td-2">${originSvg}${from}</td>
        <td>${dur}</td>
        <td><span class="prov-badge">${prov}</span> <span class="voice-badge">${voice}</span></td>
        <td class="td-mono">${tok ? tok.toLocaleString() : '—'}</td>
        <td>${audioBtns}</td>
        <td><span class="chevron" id="chev-${sid}">›</span></td>
      </tr>
      <tr class="detail" id="detail-${sid}">
        <td colspan="7">
          ${recSection}
          <div class="det-body">
            <div class="det-tokens">
              <div class="tok-cards">
                <div class="tok-card"><span class="tok-card-label">${t('prompt')}</span><span class="tok-card-val">${pTok.toLocaleString()}</span></div>
                <div class="tok-card"><span class="tok-card-label">${t('completion')}</span><span class="tok-card-val">${cTok.toLocaleString()}</span></div>
                <div class="tok-card"><span class="tok-card-label">${t('total')}</span><span class="tok-card-val">${tok.toLocaleString()}</span></div>
                <div class="tok-card"><span class="tok-card-label">${t('ttsChars')}</span><span class="tok-card-val">${tts.toLocaleString()}</span></div>
              </div>
              <div id="analysis-${sid}">${analysisHtml}</div>
            </div>
            <div class="det-transcript">
              <div class="tx-title">${t('transcript')}</div>
              ${tx}
            </div>
          </div>
          <details class="det-adv">
            <summary>${t('advResult')}</summary>
            <pre>${rawJson}</pre>
          </details>
        </td>
      </tr>`;
  }).join('');
}

function renderAnalysis(a) {
  const s = a.sentiment || 'neutral';
  const sKey = { positive:'sSentPos', neutral:'sSentNeu', negative:'sSentNeg' }[s] || 'sSentNeu';
  const prodLabel = a.productive ? t('sProductive') : t('sNotProductive');
  const hl = (a.highlights||[]).map(h=>`<li>${(h+'').replace(/</g,'&lt;')}</li>`).join('');
  return `<div class="analysis-box">
    <div class="analysis-title">${t('analysisTitle')}</div>
    <div style="margin-bottom:7px">
      <span class="s-badge s-${s.slice(0,3)}">${t(sKey)}</span>
      <span style="font-size:11px;color:var(--text-2)">${prodLabel}</span>
    </div>
    <p class="analysis-summary">${(a.summary||'').replace(/</g,'&lt;')}</p>
    ${hl ? `<ul class="analysis-hl">${hl}</ul>` : ''}
  </div>`;
}

async function analyzeCall(sid, btn) {
  btn.disabled = true; btn.textContent = t('analyzing');
  try {
    const res = await fetch(`/api/analyze/${sid}`, {method:'POST'});
    if (!res.ok) throw new Error();
    document.getElementById('analysis-' + sid).innerHTML = renderAnalysis(await res.json());
  } catch(e) { btn.disabled = false; btn.textContent = t('analyzeBtn'); }
}

function renderStats(convs) {
  const tot  = convs.length;
  const toks = convs.reduce((s,c)=>s+(((c.usage||{}).llm||{}).total_tokens||0),0);
  const avg  = tot ? Math.round(convs.reduce((s,c)=>s+(c.duration_seconds||0),0)/tot) : 0;
  const tts  = convs.reduce((s,c)=>s+((c.usage||{}).tts_characters||0),0);
  document.getElementById('statCalls').textContent  = tot;
  document.getElementById('statDur').textContent    = fmtDur(avg);
  document.getElementById('statTokens').textContent = toks.toLocaleString();
  document.getElementById('statTts').textContent    = tts.toLocaleString();
}

async function loadConversations(force) {
  try {
    const convs = await (await fetch('/api/conversations')).json();
    updateOnlineStatus(true);
    if (force || convs.length !== lastConvCount) {
      lastConvCount = convs.length;
      document.getElementById('convTable').innerHTML = renderRows(convs);
      renderStats(convs);
      openRows.forEach(sid => {
        const d = document.getElementById('detail-' + sid);
        const c = document.getElementById('chev-'   + sid);
        if (d) { d.style.display='table-row'; if(c) c.textContent='▾'; }
      });
    }
    const now = new Date();
    document.getElementById('lastUpd').textContent =
      t('lastUpd') + ' ' + now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  } catch(e) { console.error(e); updateOnlineStatus(false); }
}

function toggle(sid) {
  const d = document.getElementById('detail-' + sid);
  const c = document.getElementById('chev-'   + sid);
  const open = d.style.display === 'table-row';
  d.style.display = open ? 'none' : 'table-row';
  c.textContent   = open ? '›' : '▾';
  if (open) openRows.delete(sid); else openRows.add(sid);
}

function playAudio(sid, track) {
  const d = document.getElementById('detail-' + sid);
  const c = document.getElementById('chev-'   + sid);
  if (d.style.display !== 'table-row') { d.style.display='table-row'; c.textContent='▾'; openRows.add(sid); }
  document.getElementById('audio-'+track+'-'+sid)?.play();
}

// ── Config ────────────────────────────────────────────────────────────────────
function buildProvSel(selId, vSelId, cfg) {
  const sel = document.getElementById(selId);
  sel.innerHTML = '';
  Object.entries(PROVIDERS).forEach(([id,p]) => {
    const o = document.createElement('option');
    o.value = id; o.textContent = p.label;
    if (id === cfg.provider) o.selected = true;
    sel.appendChild(o);
  });
  buildVoiceSel(selId, vSelId, cfg);
}

function buildVoiceSel(pSelId, vSelId, cfg) {
  const voices = PROVIDERS[document.getElementById(pSelId).value]?.voices || [];
  const sel = document.getElementById(vSelId);
  sel.innerHTML = '';
  voices.forEach(v => {
    const o = document.createElement('option');
    o.value = v.id; o.textContent = v.label;
    if (v.id === cfg.voice) o.selected = true;
    sel.appendChild(o);
  });
}

function onProviderChange()  { buildVoiceSel('providerSel','voiceSel', CURRENT_CONFIG); }
function onSProviderChange() { buildVoiceSel('sProviderSel','sVoiceSel', CURRENT_CONFIG); }

async function _postConfig(pId, vId) {
  return fetch('/api/config', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ provider: document.getElementById(pId).value, voice: document.getElementById(vId).value }),
  }).then(r=>r.json());
}

function _sfb(id, ok, msg) {
  const el = document.getElementById(id);
  el.style.display='inline-block'; el.className='sfb '+(ok?'ok':'err'); el.textContent=msg;
  setTimeout(()=>{el.style.display='none';},2500);
}

async function applyConfig() {
  const btn = document.getElementById('applyBtn'); btn.disabled=true;
  const url = document.getElementById('clientUrl').value.trim();
  localStorage.setItem('clientUrl', url);
  const d = await _postConfig('providerSel','voiceSel');
  if (d.ok) document.getElementById('clientFrame').src = url;
  _sfb('statusBadge', d.ok, d.ok ? t('applied') : 'Error');
  btn.disabled=false;
}

async function applySettingsConfig() {
  const d = await _postConfig('sProviderSel','sVoiceSel');
  _sfb('sConfigStatus', d.ok, d.ok ? t('applied') : 'Error');
}

function applyClientUrl() {
  const url = document.getElementById('sClientUrl').value.trim();
  localStorage.setItem('clientUrl', url);
  document.getElementById('clientUrl').value = url;
  document.getElementById('clientFrame').src = url;
}

// ── Prompts ───────────────────────────────────────────────────────────────────
async function loadPrompts() {
  savedPrompts = await (await fetch('/api/prompts')).json();
  ['promptSel','sPromptSel'].forEach(id => {
    const sel = document.getElementById(id); const cur = sel.value;
    sel.innerHTML = `<option value="">${t('promptPH')}</option>`;
    savedPrompts.forEach(p => {
      const o = document.createElement('option');
      o.value = p.id; o.textContent = `${p.name} [${(p.lang||'en').toUpperCase()}]`;
      if (p.id === cur) o.selected = true;
      sel.appendChild(o);
    });
  });
}

function onPromptSelect()  { const p = savedPrompts.find(x=>x.id===document.getElementById('promptSel').value);  if(p) document.getElementById('promptText').value  = p.content; }
function onSPromptSelect() { const p = savedPrompts.find(x=>x.id===document.getElementById('sPromptSel').value); if(p) document.getElementById('sPromptText').value = p.content; }

function openSaveModal(src) {
  _modalSrc = src;
  const content = document.getElementById(src==='tc'?'promptText':'sPromptText').value.trim();
  if (!content) return;
  document.getElementById('modalName').value='';
  document.getElementById('saveModal').classList.add('open');
  setTimeout(()=>document.getElementById('modalName').focus(),50);
}

function closeSaveModal() { document.getElementById('saveModal').classList.remove('open'); }

async function savePrompt() {
  const name    = document.getElementById('modalName').value.trim();
  const lang    = document.getElementById('modalLang').value;
  const taId    = _modalSrc==='tc' ? 'promptText' : 'sPromptText';
  const content = document.getElementById(taId).value.trim();
  if (!name || !content) return;
  const d = await fetch('/api/prompts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,lang,content})}).then(r=>r.json());
  if (d.ok) {
    await loadPrompts();
    const last = savedPrompts[savedPrompts.length-1];
    if(last){ document.getElementById('promptSel').value=last.id; document.getElementById('sPromptSel').value=last.id; }
    closeSaveModal();
    _sfb(_modalSrc==='tc'?'promptStatus':'sPromptStatus', true, t('saved'));
  }
}

async function applyPrompt(src) {
  const taId   = src==='tc' ? 'promptText' : 'sPromptText';
  const sfbId  = src==='tc' ? 'promptStatus' : 'sPromptStatus';
  const content = document.getElementById(taId).value.trim();
  if (!content) return;
  const d = await fetch('/api/prompt/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})}).then(r=>r.json());
  _sfb(sfbId, d.ok, d.ok ? t('applied') : 'Error');
}

document.getElementById('saveModal').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeSaveModal(); });

// ── Live session ──────────────────────────────────────────────────────────────
let lastTurnCount = -1;

function getAgentState(data) {
  if (!data.active) return {cls:'idle', label: t('stateIdle')};
  const turns = data.turns || [];
  const last = turns[turns.length - 1];
  if (last && last.role === 'assistant' && (last.content||'').endsWith('…'))
    return {cls:'speaking', label: t('stateSpeaking')};
  return {cls:'listening', label: t('stateListening')};
}

async function loadLiveSession() {
  try {
    const data = await (await fetch('/api/live-session')).json();
    const isActive = !!data.active;
    const dot    = document.getElementById('liveDot');
    const infoEl = document.getElementById('liveInfo');
    const turns  = document.getElementById('liveTurns');
    const sDot   = document.getElementById('agentStateDot');
    const sLbl   = document.getElementById('agentStateLabel');

    if (wasActive && !isActive) setTimeout(()=>loadConversations(true), 2500);
    wasActive = isActive;

    const state = getAgentState(data);
    if (sDot) { sDot.className = 'astate-dot ' + state.cls; }
    if (sLbl) { sLbl.textContent = state.label; }

    if (isActive) {
      dot.classList.add('on');
      const cfg = data.config || {};
      infoEl.style.display='block';
      infoEl.innerHTML=`<strong>${t('liveActive')}</strong> · ${cfg.provider||''} / ${cfg.voice||''}<br>${(data.started_at||'').slice(0,19).replace('T',' ')}`;
    } else {
      dot.classList.remove('on');
      infoEl.style.display='none';
    }

    const list = data.turns || [];
    if (list.length !== lastTurnCount || isActive) {
      lastTurnCount = list.length;
      turns.innerHTML = !list.length
        ? `<div class="live-empty">${isActive ? t('stateListening') + '…' : t('liveEmpty')}</div>`
        : list.map(turn => {
            const cls = turn.role==='user' ? 'user' : 'assistant';
            const lbl = turn.role==='user' ? t('user') : t('assistant');
            const pending = (turn.content||'').endsWith('…');
            return `<div class="live-turn ${cls}">
              <span class="live-role">${lbl}</span>
              <div class="live-bubble${pending?' live-pending':''}">${(turn.content||'').replace(/</g,'&lt;')}</div>
            </div>`;
          }).join('');
      if (list.length) turns.scrollTop = turns.scrollHeight;
    }
  } catch(e) { /* ignore */ }
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.documentElement.setAttribute('data-theme', currentTheme);
document.getElementById('themeToggle').checked = currentTheme==='dark';

const savedUrl = localStorage.getItem('clientUrl');
if (savedUrl) {
  document.getElementById('clientUrl').value = savedUrl;
  document.getElementById('sClientUrl').value = savedUrl;
  document.getElementById('clientFrame').src = savedUrl;
}

const savedLangBtn = document.querySelector(`.lang-btn[onclick*="'${currentLang}'"]`);
if (savedLangBtn) { document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active')); savedLangBtn.classList.add('active'); }

async function init() {
  [PROVIDERS, CURRENT_CONFIG] = await Promise.all([
    fetch('/api/providers').then(r => r.json()),
    fetch('/api/config').then(r => r.json()),
  ]);
  buildProvSel('providerSel','voiceSel',   CURRENT_CONFIG);
  buildProvSel('sProviderSel','sVoiceSel', CURRENT_CONFIG);
  applyI18n();
  loadConversations();
  loadPrompts();
  setInterval(loadConversations, 15000);
  loadLiveSession();
  setInterval(loadLiveSession, 3000);
}
init();
</script>
