[project]
name = "twilio-chatbot-dial-in"
version = "0.1.0"
description = "Twilio dial-in example for Pipecat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[websocket,openai,cartesia,silero,runner]>=1.3.0",
    "pipecatcloud>=0.7.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.uv]
override-dependencies = [
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime~=1.24.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
